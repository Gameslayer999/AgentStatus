<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 482" width="620" height="482" role="img" aria-label="The AgentStatus settings window: a sidebar listing General, Lights, Colors, Audio and About, with the General pane showing Mode and Orientation toggles and sliders for light size, padding and opacity, and Reload, Reset to defaults and Quit AgentStatus buttons along the bottom.">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1b2733"/>
        <stop offset="100%" stop-color="#0f1720"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="620" height="482" rx="18" fill="url(#bg)"/>
    
    <defs><filter id="softshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.42"/>
    </filter></defs>
    <clipPath id="winclip"><rect x="0" y="0" width="560" height="430" rx="10"/></clipPath>
    <g transform="translate(30, 26)" filter="url(#softshadow)">
      <g clip-path="url(#winclip)">
      <rect x="0" y="0" width="560" height="430" rx="10" fill="#ffffff"/>
      <path d="M 0 10 a 10 10 0 0 1 10 -10 h 540 a 10 10 0 0 1 10 10 v 18 h -560 Z" fill="#ececee"/>
      <line x1="0" y1="28" x2="560" y2="28" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
      <circle cx="16" cy="14" r="6" fill="#ff5f57"/><circle cx="34" cy="14" r="6" fill="#febc2e"/><circle cx="52" cy="14" r="6" fill="#28c840"/>
      <text font-family="-apple-system, system-ui, sans-serif" x="280" y="15" fill="#3c3c43" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central">AgentStatus Settings</text>
      <rect x="0" y="28" width="148" height="402" fill="#f2f2f4"/>
    <line x1="148" y1="28" x2="148" y2="430" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><rect x="8" y="40" width="132" height="26" rx="6" fill="#0a6cff"/><text font-family="-apple-system, system-ui, sans-serif" x="18" y="53" fill="#ffffff" font-size="12.5" dominant-baseline="central">General</text><text font-family="-apple-system, system-ui, sans-serif" x="18" y="81" fill="#1d1d1f" font-size="12.5" dominant-baseline="central">Lights</text><text font-family="-apple-system, system-ui, sans-serif" x="18" y="109" fill="#1d1d1f" font-size="12.5" dominant-baseline="central">Colors</text><text font-family="-apple-system, system-ui, sans-serif" x="18" y="137" fill="#1d1d1f" font-size="12.5" dominant-baseline="central">Audio</text><text font-family="-apple-system, system-ui, sans-serif" x="18" y="165" fill="#1d1d1f" font-size="12.5" dominant-baseline="central">About</text><text font-family="-apple-system, system-ui, sans-serif" x="166" y="56" fill="#6c6c70" font-size="12.5" dominant-baseline="central">Mode</text><rect x="372" y="44" width="170" height="24" rx="7" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><rect x="372" y="44" width="85" height="24" rx="7" fill="#0a6cff"/><text x="414.5" y="57" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">Floating</text><line x1="457" y1="44" x2="457" y2="68" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><text x="499.5" y="57" fill="#1d1d1f" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">Menu bar</text><text font-family="-apple-system, system-ui, sans-serif" x="166" y="90" fill="#6c6c70" font-size="12.5" dominant-baseline="central">Orientation</text><rect x="372" y="78" width="170" height="24" rx="7" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><rect x="372" y="78" width="85" height="24" rx="7" fill="#0a6cff"/><text x="414.5" y="91" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">Horizontal</text><line x1="457" y1="78" x2="457" y2="102" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><text x="499.5" y="91" fill="#1d1d1f" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">Vertical</text><text font-family="-apple-system, system-ui, sans-serif" x="166" y="124" fill="#6c6c70" font-size="12.5" dominant-baseline="central">Light size</text><line x1="392" y1="124" x2="542" y2="124" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="392" y1="124" x2="452" y2="124" stroke="#0a6cff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="452" cy="124" r="6.5" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1"/><text font-family="-apple-system, system-ui, sans-serif" x="166" y="158" fill="#6c6c70" font-size="12.5" dominant-baseline="central">Padding</text><line x1="392" y1="158" x2="542" y2="158" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="392" y1="158" x2="474.5" y2="158" stroke="#0a6cff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="474.5" cy="158" r="6.5" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1"/><text font-family="-apple-system, system-ui, sans-serif" x="166" y="192" fill="#6c6c70" font-size="12.5" dominant-baseline="central">Opacity</text><line x1="392" y1="192" x2="542" y2="192" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="392" y1="192" x2="515" y2="192" stroke="#0a6cff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="515" cy="192" r="6.5" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1"/><text font-family="-apple-system, system-ui, sans-serif" x="166" y="230" fill="#6c6c70" font-size="11">Right-click the bar to reveal its controls: a close</text><text font-family="-apple-system, system-ui, sans-serif" x="166" y="245" fill="#6c6c70" font-size="11">button for each light, and the gear that opens this window.</text><line x1="148" y1="390" x2="560" y2="390" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><rect x="426" y="398" width="116" height="24" rx="6" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><text font-family="-apple-system, system-ui, sans-serif" x="484" y="411" fill="#1d1d1f" font-size="12" text-anchor="middle" dominant-baseline="central">Quit AgentStatus</text><rect x="300" y="398" width="118" height="24" rx="6" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><text font-family="-apple-system, system-ui, sans-serif" x="359" y="411" fill="#1d1d1f" font-size="12" text-anchor="middle" dominant-baseline="central">Reset to defaults</text><rect x="230" y="398" width="62" height="24" rx="6" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><text font-family="-apple-system, system-ui, sans-serif" x="261" y="411" fill="#1d1d1f" font-size="12" text-anchor="middle" dominant-baseline="central">Reload</text>
      </g>
      <rect x="0.5" y="0.5" width="559" height="429" rx="10" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
    </g>
  </svg>
