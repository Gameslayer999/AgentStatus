      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1b2733"/>
        <stop offset="100%" stop-color="#0f1720"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="680" height="220" rx="18" fill="url(#bg)"/>
    
    <defs><radialGradient id="h0" cx="50%" cy="50%" r="50%">
