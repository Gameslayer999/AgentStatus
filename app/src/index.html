<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>AgentStatus</title>
    <script src="/prefs.js" defer></script>
    <script src="/main.js" defer></script>
  </head>
  <body>
    <div id="bar" data-tauri-drag-region>
      <!-- The frosted pill (fill + blur + border + shadow). Kept as a clipped layer
           behind the lights so the backdrop blur can't leak past the rounded corners
           (a WebKit bug that otherwise draws a faint rectangle on light backgrounds). -->
      <div id="pill"></div>
      <!-- Lights, plus the controls row a right-click reveals beside them: one close
           button per light and the settings gear (decisions 080/082). Wrapped together
           so the controls can sit under a horizontal row / beside a vertical column
           without either one moving the other. -->
      <div id="strip" data-tauri-drag-region>
        <div id="lights" data-tauri-drag-region></div>
        <div id="closers" data-tauri-drag-region hidden></div>
      </div>
    </div>
  </body>
</html>
