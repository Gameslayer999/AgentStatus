[package]
name = "app"
version = "0.6.1"
description = "AgentStatus — a floating light bar for Claude Code and Cursor session status"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Probe IDE-lock owner PIDs (kill(pid, 0)) to tell a live IDE window from a
# force-quit one that left its lock behind — used for stale-light pruning (#027).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Set the overlay panel's window collection behavior through the maintained
# objc2-app-kit API instead of tauri-nspanel's deprecated `cocoa`-typed setter.
# Pinned to the version Tauri already pulls in transitively (no extra copy).
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }
# Read Cursor's menu-bar status item via the Accessibility API directly (decision
# 038) — needs only the Accessibility grant the app already uses, not the separate
# Automation permission that osascript → System Events would require. Versions pinned
# to what's already resolved so no duplicate CoreFoundation copy is pulled in.
accessibility-sys = "0.2"
core-foundation = "0.10"
