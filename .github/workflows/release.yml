# Build and publish a release when a v* tag is pushed (decision 041, extended for Windows
# by decision 069).
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# The tag is the trigger, so merging to main never publishes on its own — a release is
# always a deliberate act. The job refuses to build if the tag and the version in
# tauri.conf.json disagree, which is the one way a tag-driven release can silently ship
# the wrong number.
#
# Two platforms, three installers: a universal (arm64 + x86_64) DMG from a macOS runner, and
# an MSI plus an NSIS setup from a Windows runner. All are **unsigned** — GitHub's runners
# hold no Developer ID cert and no Authenticode cert — so the README's Gatekeeper step still
# applies on macOS, and Windows SmartScreen will warn on first run. The local self-signing
# in hooks/sign-app.sh (decision 039) is for build-from-source installs only and plays no
# part here.
#
# Building and publishing are separate jobs on purpose: `gh release create` can only run
# once, so the matrix uploads artifacts and a single publish job assembles the release from
# them. That also means a failure on one platform never leaves a half-published release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the installers

jobs:
  # Runs once, before anything is built: a mismatched tag should fail in seconds, not after
  # two full Tauri builds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches tauri.conf.json
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          conf="$(python3 -c "import json;print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $conf — bump the version and re-tag"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      # Publish nothing rather than half a release if one platform fails.
      fail-fast: true
      matrix:
        include:
          # macos-15 is Apple Silicon, but the DMG is universal (decision 076): Claude Code
          # supports darwin-x64, so an arm64-only build excludes every Intel Mac. The bundle
          # lands under target/universal-apple-darwin/, not target/.
          - os: macos-15
            artifact: macos-dmg
            args: --target universal-apple-darwin
            paths: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # windows-latest ships the WebView2 runtime the app needs, so nothing extra is
          # installed here.
          - os: windows-latest
            artifact: windows-installers
            args: ""
            paths: |
              app/src-tauri/target/release/bundle/msi/*.msi
              app/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on the Windows runner, so one script works on both platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # `--target universal-apple-darwin` compiles both slices, so both standard libraries
      # have to be installed before tauri starts. stage-hook.mjs adds them too, but leaving it
      # at that would make the app's build depend on a beforeBuildCommand side effect.
      - name: Add the macOS universal targets
        if: matrix.os == 'macos-15'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Both Cargo.lock files are committed, so this restores an exact-match build cache.
      # The hook is its own crate (decision 068) and would otherwise rebuild every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            hooks/agentstatus-hook

      # `tauri build` runs hooks/stage-hook.mjs first (beforeBuildCommand), which builds the
      # hook crate and stages the binary as a bundle resource. On macOS the env var makes it
      # stage a `lipo`'d arm64+x86_64 hook — a single-arch hook inside a universal app would
      # be dead on the other architecture (decision 076). It is ignored off macOS.
      - name: Build
        working-directory: app
        env:
          AGENTSTATUS_HOOK_UNIVERSAL: "1"
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # Checked out only for docs/release-notes/<tag>.md — the artifacts carry everything
      # else the release needs.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The installers are collected with `find`, not `dist/*`, because the two artifacts do
      # not arrive with the same shape. `upload-artifact` keeps the directory structure below
      # the common ancestor of the paths it was given: the macOS job passes one path, so its
      # DMG lands flat in dist/, while the Windows job passes two (msi/ and nsis/), so those
      # arrive as dist/msi/ and dist/nsis/. A `dist/*` glob therefore hands `gh` a directory,
      # which fails the upload with "read dist/msi: is a directory" — observed on the v0.8.0
      # tag, after both builds had succeeded (decision 079). Recursing over files is immune
      # to the shape either job happens to produce.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find dist -type f | sort)
          printf 'publishing %s\n' "${installers[@]}"
          [ ${#installers[@]} -ge 3 ] || { echo "::error::expected 3 installers, found ${#installers[@]}"; exit 1; }
          # A release says what changed in the author's words first, then the commit list
          # GitHub generates. `docs/release-notes/<tag>.md` is that first part; gh puts it
          # above the generated notes. Without the file the release is generated notes
          # alone, exactly as before — the description is optional, never a blocker.
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "using $notes as the release description"
            gh release create "$GITHUB_REF_NAME" "${installers[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentStatus ${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              --generate-notes
          else
            echo "no $notes — publishing with generated notes only"
            gh release create "$GITHUB_REF_NAME" "${installers[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentStatus ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
